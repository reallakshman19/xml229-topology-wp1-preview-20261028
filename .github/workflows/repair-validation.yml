name: Topology repair validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and source-custody checks
        run: |
          python3 -B -m unittest discover -s tests -v
          node --test tests/*.test.mjs
          node --check tabs/topology-workspace/workspace-app.mjs
      - name: Assemble browser preview with pinned runtime and input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --exclude='./.git' --exclude='./.github' --exclude='./dist' -cf - . | tar -xf - -C dist
          root='https://raw.githubusercontent.com/reallakshman19/3D_Converters/cba348152faa9c2077d5c91a5f85b4b81d2e8e25'
          curl --fail --location --retry 3 "$root/vendor/pyodide/pyodide.asm.wasm" -o dist/vendor/pyodide/pyodide.asm.wasm
          curl --fail --location --retry 3 "$root/vendor/pyodide/python_stdlib.zip" -o dist/vendor/pyodide/python_stdlib.zip
          test "$(git hash-object dist/vendor/pyodide/pyodide.asm.wasm)" = 27b9cadfe2f52a4f76ada365cba6d891848838bd
          test "$(git hash-object dist/vendor/pyodide/python_stdlib.zip)" = e4c642f5824d41f36bf99aa9c761a2576620fa7c
          curl --fail --location --retry 3 "$root/Benchmarks/1885Sjson/FirstpassXML" -o tests/FirstpassXML
          echo 'feee5a5a6399207337e63bc56c8afb001fe37ab30c6a7a9283333ec60f6eea38  tests/FirstpassXML' | sha256sum -c -
      - name: Full Chromium and Pyodide repair journey
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.52.0
          npx playwright install --with-deps chromium
          node tests/audit-browser.mjs
      - name: Retain repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-repair-validation
          path: |
            preview-test-results.json
            preview-test-results/
          retention-days: 7
