name: UXML-S3 read-only InputXML into TopoFix (XCU ddd3ebc7)
on:
  pull_request:
    paths:
      - 'converters/psi116_topology_resolver/uxml_adapter.py'
      - 'converters/psi116_topology_resolver/uxml_compare.py'
      - 'converters/psi116_topology_resolver/uxml_edit_ops.py'
      - 'converters/psi116_topology_resolver/uxml_export_ops.py'
      - 'converters/psi116_topology_resolver/uxml_patch_psi116.py'
      - 'converters/psi116_topology_resolver/parser.py'
      - 'converters/psi116_topology_resolver/resolver.py'
      - 'converters/psi116_topology_resolver/analysis.py'
      - 'converters/psi116_topology_resolver/models.py'
      - 'converters/psi116_topology_resolver/planner.py'
      - 'converters/psi116_topology_resolver/transaction.py'
      - 'converters/psi116_topology_resolver/short_memo.py'
      - 'converters/xml-cii-2019-standalone/topology-integration.js'
      - 'tabs/topology-workspace/topology-worker.mjs'
      - 'tests/test_uxml_s3_mutation_guards.py'
      - 'tests/test_uxml_s3_final_hold_guards.py'
      - 'tests/test_uxml_s3_long_run.py'
      - 'tests/test_uxml_s3_caesar.py'
      - 'tests/test_uxml_s3_reconcile.py'
      - 'tests/test_uxml_s3_readonly_guard.py'
      - '.github/workflows/uxml-s3-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputxml-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exactly XCU ddd3ebc770359a25e9f0e74b2ea71fa2c063e272 with seventeen Git blob checks (not vendored)
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/xcu-uxml-s3"
          upstream="https://raw.githubusercontent.com/reallakshman19/XML_Compare_Utilities/ddd3ebc770359a25e9f0e74b2ea71fa2c063e272"
          mkdir -p "$root/$(dirname 'package.json')"
          curl --fail --location --retry 3 "$upstream/package.json" -o "$root/package.json"
          test "$(git hash-object "$root/package.json")" = "4523bd12a9ace4172d50b7a0b2b99eeb94ab5d33"
          mkdir -p "$root/$(dirname 'uxml/UxmlConstants.js')"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlConstants.js" -o "$root/uxml/UxmlConstants.js"
          test "$(git hash-object "$root/uxml/UxmlConstants.js")" = "457b970f9cbccd29d38cecd0842614c339108107"
          mkdir -p "$root/$(dirname 'uxml/UxmlProfileDetector.js')"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlProfileDetector.js" -o "$root/uxml/UxmlProfileDetector.js"
          test "$(git hash-object "$root/uxml/UxmlProfileDetector.js")" = "b4edfc1b47337a0ad62d2a01c0c8f2ff86844803"
          mkdir -p "$root/$(dirname 'uxml/UxmlTypes.js')"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlTypes.js" -o "$root/uxml/UxmlTypes.js"
          test "$(git hash-object "$root/uxml/UxmlTypes.js")" = "5bac50ca692c483c3800ae7ec712710e7ae08572"
          mkdir -p "$root/$(dirname 'uxml/UxmlValidationGate.js')"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlValidationGate.js" -o "$root/uxml/UxmlValidationGate.js"
          test "$(git hash-object "$root/uxml/UxmlValidationGate.js")" = "7a6070f9b77602f227a30d7e06a3e425d17c9c16"
          mkdir -p "$root/$(dirname 'uxml/UxmlPsi116SchemaMapper.js')"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlPsi116SchemaMapper.js" -o "$root/uxml/UxmlPsi116SchemaMapper.js"
          test "$(git hash-object "$root/uxml/UxmlPsi116SchemaMapper.js")" = "978a63141fb94ef9cad3c8eaa637a37675a605f9"
          mkdir -p "$root/$(dirname 'uxml/UxmlInputXmlSchemaMapper.js')"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlInputXmlSchemaMapper.js" -o "$root/uxml/UxmlInputXmlSchemaMapper.js"
          test "$(git hash-object "$root/uxml/UxmlInputXmlSchemaMapper.js")" = "0be0d67fe13ea92da9a4f2980f67c6f5d59dc67d"
          mkdir -p "$root/$(dirname 'uxml/UxmlInputXmlDeltaGraph.js')"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlInputXmlSourceStructure.js" -o "$root/uxml/UxmlInputXmlSourceStructure.js"
          test "$(git hash-object "$root/uxml/UxmlInputXmlSourceStructure.js")" = "76d27ee904e5a3ed10cb59c58d97ecb7fd3562dc"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlInputXmlDeltaGraph.js" -o "$root/uxml/UxmlInputXmlDeltaGraph.js"
          test "$(git hash-object "$root/uxml/UxmlInputXmlDeltaGraph.js")" = "8b45016bccf2a759108dfa6efc9827cc1c2eba7d"
          mkdir -p "$root/$(dirname 'utils/line-no-metadata.js')"
          curl --fail --location --retry 3 "$upstream/utils/line-no-metadata.js" -o "$root/utils/line-no-metadata.js"
          test "$(git hash-object "$root/utils/line-no-metadata.js")" = "8315e966d5911ba60703ee3726166e3a3035c6df"
          mkdir -p "$root/$(dirname 'tools/psi116-to-uxml.mjs')"
          curl --fail --location --retry 3 "$upstream/tools/psi116-to-uxml.mjs" -o "$root/tools/psi116-to-uxml.mjs"
          test "$(git hash-object "$root/tools/psi116-to-uxml.mjs")" = "7148fc20000963c5a32be27a7787705745e1d30b"
          mkdir -p "$root/$(dirname 'tools/inputxml-to-uxml.mjs')"
          curl --fail --location --retry 3 "$upstream/tools/inputxml-to-uxml.mjs" -o "$root/tools/inputxml-to-uxml.mjs"
          test "$(git hash-object "$root/tools/inputxml-to-uxml.mjs")" = "7f32736308a0baea86b95c3281bb0bbd71d12176"
          mkdir -p "$root/$(dirname 'tests/fixtures/uxml-s3-synthetic.psi116.xml')"
          curl --fail --location --retry 3 "$upstream/tests/fixtures/uxml-s3-synthetic.psi116.xml" -o "$root/tests/fixtures/uxml-s3-synthetic.psi116.xml"
          test "$(git hash-object "$root/tests/fixtures/uxml-s3-synthetic.psi116.xml")" = "f262e6a4affb5c5a929b12c415a04569b79dbe46"
          mkdir -p "$root/$(dirname 'tests/fixtures/uxml-s3-synthetic.workspace.input.xml')"
          curl --fail --location --retry 3 "$upstream/tests/fixtures/uxml-s3-synthetic.workspace.input.xml" -o "$root/tests/fixtures/uxml-s3-synthetic.workspace.input.xml"
          test "$(git hash-object "$root/tests/fixtures/uxml-s3-synthetic.workspace.input.xml")" = "ed141547b7b8cb4ee0cc4c07b1d888850681749e"
          mkdir -p "$root/$(dirname 'tests/fixtures/uxml-s3-synthetic.workspace.delta-only.input.xml')"
          curl --fail --location --retry 3 "$upstream/tests/fixtures/uxml-s3-synthetic.workspace.delta-only.input.xml" -o "$root/tests/fixtures/uxml-s3-synthetic.workspace.delta-only.input.xml"
          test "$(git hash-object "$root/tests/fixtures/uxml-s3-synthetic.workspace.delta-only.input.xml")" = "4888341e419b0efbd5deb93c012fdbe672014773"
          mkdir -p "$root/$(dirname 'docs/GREInputxml.xml')"
          curl --fail --location --retry 3 "$upstream/docs/GREInputxml.xml" -o "$root/docs/GREInputxml.xml"
          test "$(git hash-object "$root/docs/GREInputxml.xml")" = "e7dc8ff9b1082d489609980bb495ced048a81679"
          mkdir -p "$root/$(dirname 'docs/PLB314Inputxml.xml')"
          curl --fail --location --retry 3 "$upstream/docs/PLB314Inputxml.xml" -o "$root/docs/PLB314Inputxml.xml"
          test "$(git hash-object "$root/docs/PLB314Inputxml.xml")" = "b0bdcf853992cee6ae7911e7a4c035c6b7ff7990"
          echo "XCU_UXML_ROOT=$root" >> "$GITHUB_ENV"
      - name: Baseline versus current Python unittest counts and zero new skips
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin f4509b5a11f6213040577af2d24a3824df3cc4a1
          git worktree add --detach "$RUNNER_TEMP/topofix-main-baseline" f4509b5a11f6213040577af2d24a3824df3cc4a1
          python3 - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path
          work=Path(os.environ["GITHUB_WORKSPACE"])
          baseline=Path(os.environ["RUNNER_TEMP"])/"topofix-main-baseline"
          def run(path, label):
              proc=subprocess.run([sys.executable,"-B","-m","unittest","discover","-s","tests",
                                   "-p","test_*.py","-v"],cwd=path,capture_output=True,text=True,
                                  env=os.environ.copy(),timeout=1200)
              log=proc.stdout+"\n"+proc.stderr
              found=re.search(r"Ran (\d+) tests? in",log)
              skipped=re.search(r"OK \(skipped=(\d+)\)",log)
              if proc.returncode or found is None:
                  print(label+" TESTS FAILED OR COUNTS MISSING\n"+log,flush=True)
                  raise SystemExit(1)
              count=int(found.group(1)); skips=int(skipped.group(1)) if skipped else 0
              print(f"{label} PYTHON TESTS={count} SKIPS={skips} EXIT={proc.returncode}",flush=True)
              return count,skips
          before,old_skips=run(baseline,"MAIN_F4509B5A")
          now,new_skips=run(work,"STEP_2A_HEAD")
          assert now==before+132,(before,now,"EXPECTED_258_PRE_A3_R1_PLUS_8_REPAIR_TESTS")
          assert new_skips<=old_skips,(old_skips,new_skips,"NEW_TEST_SKIPS_REFUSED")
          print(f"PYTHON_BASELINE_DELTA={now-before}; NEW_SKIPS={max(0,new_skips-old_skips)}")
          PY
      - name: Three-way B1 historical repro, public reverse N=1200/5000
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin d196e345c17b7cbc74df9219c56e816efc5d2ee4
          git fetch --no-tags --depth=1 origin c6b3e9d3ad4d2fb756b9e811e61e63d33bc86bc7
          git worktree add --detach "$RUNNER_TEMP/topofix-2b-fork" d196e345c17b7cbc74df9219c56e816efc5d2ee4
          git worktree add --detach "$RUNNER_TEMP/topofix-2b-reviewed" c6b3e9d3ad4d2fb756b9e811e61e63d33bc86bc7
          python3 -u - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          root=Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0,str(root/"tests"))
          from test_uxml_s3_long_run import PublicXcuLongRunRegression
          PublicXcuLongRunRegression.setUpClass()
          witness=PublicXcuLongRunRegression(
              "test_B1_reverse_1200_original_source_document_and_real_resolve")
          runner=Path(os.environ["RUNNER_TEMP"])
          code="""
          import json,sys
          from converters.psi116_topology_resolver.uxml_adapter import (
              document_from_uxml, resolve_from_uxml)
          with open(sys.argv[1],encoding="utf-8") as file:
              hub=json.load(file)
          for name,analyze in (("DOCUMENT",document_from_uxml),
                               ("RESOLVE",resolve_from_uxml)):
              try:
                  analyze(hub)
              except RecursionError:
                  print(name+"=RECURSION_ERROR")
              else:
                  print(name+"=OK")
          """
          versions=(
              ("BASE_D196",runner/"topofix-2b-fork","OK"),
              ("REVIEWED_C6",runner/"topofix-2b-reviewed","RECURSION_ERROR"),
          )
          for count in (1200,5000):
              hub=witness.hub(count,reverse=True)
              with tempfile.TemporaryDirectory(prefix="public-b1-three-way-") as folder:
                  path=Path(folder)/"public-source-backed-hub.json"
                  path.write_text(json.dumps(hub),encoding="utf-8")
                  for label,checkout,expected in versions:
                      env=os.environ.copy()
                      env["PYTHONPATH"]=str(checkout)
                      proc=subprocess.run(
                          [sys.executable,"-B","-c",code,str(path)],
                          cwd=checkout,env=env,capture_output=True,text=True,timeout=360)
                      if proc.returncode:
                          raise AssertionError(f"{label}_B1_N{count}_FAILED: "+
                                               proc.stdout+proc.stderr)
                      expected_lines=["DOCUMENT="+expected,"RESOLVE="+expected]
                      assert proc.stdout.splitlines()==expected_lines,(
                          label,count,proc.stdout,expected_lines)
                      print(f"{label}_B1_N{count}=DOCUMENT_{expected}_"
                            f"RESOLVE_{expected}",flush=True)
          PY
      - name: Rerun S3 synthetic/public tests on ddd3 pin and enforce no skips
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_uxml_s3_caesar.py -v 2>&1 | tee "$RUNNER_TEMP/s3-caesar.log"
          python3 -B -m unittest discover -s tests -p test_uxml_s3_reconcile.py -v 2>&1 | tee "$RUNNER_TEMP/s3-reconcile.log"
          # unittest -v writes progress to stderr while mutant receipts go to
          # stdout. Keep streams separate so ^MUTANT_RED anchors cannot be
          # prefixed by progress text even with unbuffered Python.
          if python3 -u -B -m unittest discover -s tests -p test_uxml_s3_mutation_guards.py -v \
              >"$RUNNER_TEMP/s3-mutants.stdout" 2>"$RUNNER_TEMP/s3-mutants.stderr"; then
            cat "$RUNNER_TEMP/s3-mutants.stdout" "$RUNNER_TEMP/s3-mutants.stderr" | tee "$RUNNER_TEMP/s3-mutants.log"
          else
            cat "$RUNNER_TEMP/s3-mutants.stdout" "$RUNNER_TEMP/s3-mutants.stderr"
            exit 1
          fi
          test "$(grep -c '^MUTANT_RED:ADAPTER:' "$RUNNER_TEMP/s3-mutants.log")" = 16
          test "$(grep -c '^MUTANT_RED:COMPARE:' "$RUNNER_TEMP/s3-mutants.log")" = 4
          test "$(grep -c '^MUTANT_RED:T1:' "$RUNNER_TEMP/s3-mutants.log")" = 3
          test "$(grep -c '^MUTANT_RED:T2:' "$RUNNER_TEMP/s3-mutants.log")" = 2
          test "$(grep -c '^MUTANT_RED:R2_B1:' "$RUNNER_TEMP/s3-mutants.log")" = 3
          test "$(grep -c '^MUTANT_RED:R2_B2:' "$RUNNER_TEMP/s3-mutants.log")" = 1
          test "$(grep -c '^MUTANT_RED:R2_B3:' "$RUNNER_TEMP/s3-mutants.log")" = 2
          test "$(grep -c '^MUTANT_RED:R3_C1:' "$RUNNER_TEMP/s3-mutants.log")" = 1
          test "$(grep -c '^MUTANT_RED:R3_C2:' "$RUNNER_TEMP/s3-mutants.log")" = 1
          test "$(grep -c '^MUTANT_RED:R3_C3:' "$RUNNER_TEMP/s3-mutants.log")" = 1
          test "$(grep -c '^MUTANT_RED:R3_C4:' "$RUNNER_TEMP/s3-mutants.log")" = 7
          test "$(grep -c '^MUTANT_RED:R3_C5:' "$RUNNER_TEMP/s3-mutants.log")" = 2
          test "$(grep -c '^MUTANT_RED:A3:T1_' "$RUNNER_TEMP/s3-mutants.log")" = 1
          test "$(grep -c '^MUTANT_RED:A3:T2_' "$RUNNER_TEMP/s3-mutants.log")" = 1
          test "$(grep -c '^MUTANT_RED:A3:T3_' "$RUNNER_TEMP/s3-mutants.log")" = 1
          test "$(grep -c '^MUTANT_RED:A3:T4_' "$RUNNER_TEMP/s3-mutants.log")" = 2
          test "$(grep -c '^MUTANT_RED:A3_R1:' "$RUNNER_TEMP/s3-mutants.log")" = 3
          test "$(grep -c '^MUTANT_RED:A3_R2:' "$RUNNER_TEMP/s3-mutants.log")" = 1
          test "$(grep -c '^MUTANT_RED:A3_R3:' "$RUNNER_TEMP/s3-mutants.log")" = 1
          test "$(grep -c '^MUTANT_RED:A3_R4:' "$RUNNER_TEMP/s3-mutants.log")" = 1
          test "$(grep -c '^MUTANT_RED:CLI:' "$RUNNER_TEMP/s3-mutants.log")" = 2
          grep -Fq 'MUTANT_RED:NATIVE_APPLY:INPUT_XML_APPLY_NOT_ENABLED' "$RUNNER_TEMP/s3-mutants.log"
          python3 -B -m unittest discover -s tests -p test_uxml_s3_final_hold_guards.py -v 2>&1 | tee "$RUNNER_TEMP/s3-final-guards.log"
          python3 -B -m unittest discover -s tests -p test_uxml_s3_readonly_guard.py -v 2>&1 | tee "$RUNNER_TEMP/s3-readonly.log"
          if grep -Eqi '\bskipped\b' "$RUNNER_TEMP/s3-caesar.log" "$RUNNER_TEMP/s3-reconcile.log" "$RUNNER_TEMP/s3-readonly.log" "$RUNNER_TEMP/s3-mutants.log" "$RUNNER_TEMP/s3-final-guards.log"; then
            echo "S3_TEST_SKIP_REFUSED" >&2; exit 1
          fi
      - name: Public synthetic PSI116 versus InputXML findings by code and strict thirteen differences
        shell: bash
        run: |
          set -euo pipefail
          x="$XCU_UXML_ROOT"
          node "$x/tools/psi116-to-uxml.mjs" "$x/tests/fixtures/uxml-s3-synthetic.psi116.xml" > "$RUNNER_TEMP/s3-psi.uxml.json"
          node "$x/tools/inputxml-to-uxml.mjs" "$x/tests/fixtures/uxml-s3-synthetic.workspace.input.xml" > "$RUNNER_TEMP/s3-input.uxml.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from converters.psi116_topology_resolver.models import ResolverConfig
          from converters.psi116_topology_resolver.uxml_adapter import resolve_from_uxml
          from converters.psi116_topology_resolver.uxml_compare import compare_cross_format_uxml
          folder=Path(os.environ["RUNNER_TEMP"])
          psi=json.loads((folder/"s3-psi.uxml.json").read_text())
          inp=json.loads((folder/"s3-input.uxml.json").read_text())
          cfg=ResolverConfig()
          p=resolve_from_uxml(psi).findings_payload(cfg)["summary"]["findingCountsByCode"]
          i=resolve_from_uxml(inp).findings_payload(cfg)["summary"]["findingCountsByCode"]
          print("FINDING_CODE | PSI116 | INPUT_XML")
          for key in sorted(set(p)|set(i)): print(f"{key} | {p.get(key,0)} | {i.get(key,0)}")
          diffs=compare_cross_format_uxml(psi,inp)
          for value in diffs: print(value)
          assert len(diffs)==13,(len(diffs),"UNEXPLAINED_DIFFERENCE_COUNT_CHANGED")
          assert sum("field=component_ref_no" in d for d in diffs)==9
          assert sum("SIF@TYPE=5" in d for d in diffs)==4
          assert all(d.startswith("UNEXPLAINED CLASS=B_WORKSPACE_CONVERSION_LOSS ") for d in diffs)
          print("UNEXPLAINED_TOTAL=13 COMPONENT_REF_NO=9 SIF_OWNER=4; no allow-list")
          PY
          python3 -m converters.psi116_topology_resolver.uxml_compare "$x/tests/fixtures/uxml-s3-synthetic.psi116.xml" "$RUNNER_TEMP/s3-psi.uxml.json"
          set +e
          python3 -m converters.psi116_topology_resolver.uxml_compare "$RUNNER_TEMP/s3-psi.uxml.json" "$RUNNER_TEMP/s3-input.uxml.json" --cross-format > "$RUNNER_TEMP/s3-differences.log"
          code=$?
          set -e
          test "$code" = 1
          grep -Fq "UNEXPLAINED" "$RUNNER_TEMP/s3-differences.log"
          grep -Fq "CAUSE:" "$RUNNER_TEMP/s3-differences.log"
          cat "$RUNNER_TEMP/s3-differences.log"
      - name: A3-R1 honest PSI116 cross-format CLI bytes identical to accepted A3 head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin f3b8c72ef7ec31625b3003df1261d5a3aa9ef429
          git worktree add --detach "$RUNNER_TEMP/topofix-a3-accepted" f3b8c72ef7ec31625b3003df1261d5a3aa9ef429
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          root=Path(os.environ["GITHUB_WORKSPACE"])
          accepted=Path(os.environ["RUNNER_TEMP"])/"topofix-a3-accepted"
          folder=Path(os.environ["RUNNER_TEMP"])
          files=[str(folder/"s3-psi.uxml.json"),str(folder/"s3-input.uxml.json"),
                 "--cross-format"]
          def run(where):
              env=os.environ.copy()
              env["PYTHONPATH"]=str(where)
              return subprocess.run(
                  [sys.executable,"-B","-m",
                   "converters.psi116_topology_resolver.uxml_compare",*files],
                  cwd=where,env=env,capture_output=True,timeout=180)
          old,new=run(accepted),run(root)
          assert old.returncode==new.returncode==1, (
              "HONEST_COMPARE_EXIT_CHANGED",old.returncode,new.returncode)
          assert old.stdout==new.stdout, "HONEST_COMPARE_STDOUT_NOT_BYTE_IDENTICAL"
          assert old.stderr==new.stderr==b"", "HONEST_COMPARE_STDERR_CHANGED"
          assert old.stdout.count(b"UNEXPLAINED CLASS=")==13, (
              "HONEST_COMPARE_DIFFERENCE_COUNT_CHANGED",
              old.stdout.count(b"UNEXPLAINED CLASS="))
          print("A3_R1_HONEST_CLI_BYTE_IDENTICAL=PASS"
                " A3_BASE=f3b8c72e DIFFERENCES=13",flush=True)
          PY
      - name: All Node test modules
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
