name: UXML-S1 TopoFix pinned PSI116 reader equivalence
on:
  pull_request:
    paths:
      - 'converters/psi116_topology_resolver/uxml_adapter.py'
      - 'converters/psi116_topology_resolver/uxml_compare.py'
      - 'tests/test_uxml_psi116_s1.py'
      - '.github/workflows/uxml-s1-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch XCU reader from exactly 3f8df9da601b0d620a6c90c4c9be2e6a586773ff and verify every Git blob
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/xcu-uxml-reader"
          upstream="https://raw.githubusercontent.com/reallakshman19/XML_Compare_Utilities/3f8df9da601b0d620a6c90c4c9be2e6a586773ff"
          mkdir -p "$root/uxml" "$root/tools"
          curl --fail --location --retry 3 "$upstream/package.json" -o "$root/package.json"
          test "$(git hash-object "$root/package.json")" = "8b0cc1e976ef2cd3cd10f344b37463738d22ea3d"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlConstants.js" -o "$root/uxml/UxmlConstants.js"
          test "$(git hash-object "$root/uxml/UxmlConstants.js")" = "457b970f9cbccd29d38cecd0842614c339108107"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlProfileDetector.js" -o "$root/uxml/UxmlProfileDetector.js"
          test "$(git hash-object "$root/uxml/UxmlProfileDetector.js")" = "b4edfc1b47337a0ad62d2a01c0c8f2ff86844803"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlTypes.js" -o "$root/uxml/UxmlTypes.js"
          test "$(git hash-object "$root/uxml/UxmlTypes.js")" = "5bac50ca692c483c3800ae7ec712710e7ae08572"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlValidationGate.js" -o "$root/uxml/UxmlValidationGate.js"
          test "$(git hash-object "$root/uxml/UxmlValidationGate.js")" = "7a6070f9b77602f227a30d7e06a3e425d17c9c16"
          curl --fail --location --retry 3 "$upstream/uxml/UxmlPsi116SchemaMapper.js" -o "$root/uxml/UxmlPsi116SchemaMapper.js"
          test "$(git hash-object "$root/uxml/UxmlPsi116SchemaMapper.js")" = "c7559543966b33d65fb5c9e65a8617cb93cab395"
          curl --fail --location --retry 3 "$upstream/tools/psi116-to-uxml.mjs" -o "$root/tools/psi116-to-uxml.mjs"
          test "$(git hash-object "$root/tools/psi116-to-uxml.mjs")" = "e403174b810c0d6eaab159aa1f1cc8bf2ebdf2f2"
          echo "XCU_UXML_ROOT=$root" >> "$GITHUB_ENV"
      - name: DELIBERATE RED - make ephemeral checked reader drop CLOS declaration (test must fail)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['XCU_UXML_ROOT']) / 'uxml/UxmlPsi116SchemaMapper.js'
          source = p.read_text(encoding='utf8')
          original = "const connectionType = textOf(node, 'ConnectionType').toUpperCase();"
          assert source.count(original) == 1, "Source pin changed; cannot stage falsifier"
          p.write_text(source.replace(original, "const connectionType = ''; // RED: CLOS is intentionally lost"),
                       encoding='utf8')
          PY
      - name: Direct PSI116 vs pinned reader/UXML adapter same native engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_uxml_psi116_s1.py -v
          node --check "$XCU_UXML_ROOT/uxml/UxmlPsi116SchemaMapper.js"
