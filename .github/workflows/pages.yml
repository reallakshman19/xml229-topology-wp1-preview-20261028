name: XML229 standalone WP1 preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xml229-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact-source preview with pinned Pyodide binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --exclude='./.git' --exclude='./.github' --exclude='./dist' -cf - . | tar -xf - -C dist
          mkdir -p dist/vendor/pyodide
          root='https://raw.githubusercontent.com/reallakshman19/3D_Converters/cba348152faa9c2077d5c91a5f85b4b81d2e8e25/vendor/pyodide'
          curl --fail --location --retry 3 "$root/pyodide.asm.wasm" --output dist/vendor/pyodide/pyodide.asm.wasm
          curl --fail --location --retry 3 "$root/python_stdlib.zip" --output dist/vendor/pyodide/python_stdlib.zip
          test "$(git hash-object dist/vendor/pyodide/pyodide.asm.wasm)" = 27b9cadfe2f52a4f76ada365cba6d891848838bd
          test "$(git hash-object dist/vendor/pyodide/python_stdlib.zip)" = e4c642f5824d41f36bf99aa9c761a2576620fa7c
          test -f dist/index.html
          test -f dist/converters/psi116_topology_resolver/__init__.py
          test -f dist/.nojekyll
          echo "Pinned runtime binary checks PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test rule grouping and validate preview module syntax
        run: |
          node --check tabs/topology-workspace/audit-view.mjs
          node --check tabs/topology-workspace/workspace-app.mjs
          node --test tests/audit-view.test.mjs
      - name: Run real PSI116 browser audit against pinned FirstpassXML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/reallakshman19/3D_Converters/cba348152faa9c2077d5c91a5f85b4b81d2e8e25/Benchmarks/1885Sjson/FirstpassXML' -o tests/FirstpassXML
          echo 'feee5a5a6399207337e63bc56c8afb001fe37ab30c6a7a9283333ec60f6eea38  tests/FirstpassXML' | sha256sum -c -
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.52.0
          npx playwright install --with-deps chromium
          node tests/audit-browser.mjs
      - name: Retain real browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml229-rule-audit-browser-evidence
          path: |
            preview-test-results.json
            preview-test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload standalone preview build for independent testing
        uses: actions/upload-artifact@v4
        with:
          name: xml229-wp1-static-preview
          path: ./dist
          include-hidden-files: true
          retention-days: 7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
